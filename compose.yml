services:
  web-app:
    build: ./app
    container_name: devops-web-app
    restart: unless-stopped
    networks:
      - app-net

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

